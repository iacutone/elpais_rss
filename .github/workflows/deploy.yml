name: Deploy to Hetzner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - name: Install Kamal
      run: |
        gem install kamal
        kamal version

    - name: Set up SSH agent
      uses: webfactory/ssh-agent@v0.9.0 # Configures SSH agent with your private key
      with:
        ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }} # Loads the private key from GitHub secrets

    - name: Add SSH known hosts
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        # Remove any existing entry for this host
        ssh-keygen -R ${{ secrets.HETZNER_HOST }} || true
        # Add the current host key
        ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts


    - name: Install dependencies
      run: |
        mix local.hex --force
        mix local.rebar --force
        mix deps.get

    - name: Setup Kamal Configuration
      env:
        HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      run: |
        # Create .kamal/secrets file
        mkdir -p .kamal
        cat > .kamal/secrets << EOF
        AWS_ACCESS_KEY=\$AWS_ACCESS_KEY
        AWS_SECRET_KEY=\$AWS_SECRET_KEY
        EL_PAIS_RSS_URL=\$EL_PAIS_RSS_URL
        MAILCHIMP_API_KEY=\$MAILCHIMP_API_KEY
        GOOGLE_GEMINI_API_KEY=\$GOOGLE_GEMINI_API_KEY
        DOCKER_REGISTRY_PASSWORD=\$DOCKER_REGISTRY_PASSWORD
        HETZNER_HOST=\$HETZNER_HOST
        EOF

    - name: Deploy with Kamal
      env:
        AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
        EL_PAIS_RSS_URL: ${{ secrets.EL_PAIS_RSS_URL }}
        MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
        HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      run: |
        kamal deploy --skip-push || (echo "Deployment failed" && exit 1)
