name: Run ElPais RSS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'  # 11 AM EST (16:00 UTC) / 11 AM EDT (15:00 UTC during DST)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17.3'
          otp-version: '26.0.2'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      
      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      
      - name: Run ElPais RSS
        env:
          SES_ACCESS_KEY_ID: ${{ secrets.SES_ACCESS_KEY_ID }}
          SES_SECRET_ACCESS_KEY: ${{ secrets.SES_SECRET_ACCESS_KEY }}
          EL_PAIS_RSS_URL: ${{ secrets.EL_PAIS_RSS_URL }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          CRONHUB_URL: ${{ secrets.CRONHUB_URL }}
          MAILCHIMP_UNSUBSCRIBE_ENDPOINT: ${{ secrets.MAILCHIMP_UNSUBSCRIBE_ENDPOINT }}
          MIX_ENV: prod
        run: mix run -e "ElpaisRss.run()"
