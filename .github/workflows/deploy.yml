name: Deploy to Hetzner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4.5'

    - name: Setup Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.17.3'
        otp-version: '26.0.2'

    - name: Install Kamal
      run: |
        gem install kamal
        kamal version

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

    - name: Install dependencies
      run: |
        mix local.hex --force
        mix local.rebar --force
        mix deps.get

    - name: Setup Kamal Configuration
      env:
        HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      run: |
        # Update the deploy config with the actual host
        sed -i "s/your-hetzner-server-ip/$HETZNER_HOST/g" config/deploy.yml
        # Create .kamal/secrets file
        mkdir -p .kamal
        cat > .kamal/secrets << EOF
        AWS_ACCESS_KEY=\$AWS_ACCESS_KEY
        AWS_SECRET_KEY=\$AWS_SECRET_KEY
        EL_PAIS_RSS_URL=\$EL_PAIS_RSS_URL
        MAILCHIMP_API_KEY=\$MAILCHIMP_API_KEY
        GOOGLE_GEMINI_API_KEY=\$GOOGLE_GEMINI_API_KEY
        EOF

    - name: Deploy with Kamal
      env:
        AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
        EL_PAIS_RSS_URL: ${{ secrets.EL_PAIS_RSS_URL }}
        MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
        HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      run: |
        # Deploy using Kamal gem
        kamal deploy 
