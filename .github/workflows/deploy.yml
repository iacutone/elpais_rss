name: Deploy to Hetzner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.17.3'
        otp-version: '26.0.2'

    - name: Install Kamal
      run: |
        # Install Kamal manually with proper version detection
        mkdir -p $HOME/.local/bin
        # Get the latest version and find the correct asset
        KAMAL_VERSION=$(curl -s https://api.github.com/repos/basecamp/kamal/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
        echo "Installing Kamal version: $KAMAL_VERSION"
        # Debug: show all available assets
        echo "Available assets:"
        curl -s "https://api.github.com/repos/basecamp/kamal/releases/latest" | grep '"browser_download_url"' | head -5
        # Find the correct asset URL for linux x86_64
        ASSET_URL=$(curl -s "https://api.github.com/repos/basecamp/kamal/releases/latest" | grep '"browser_download_url"' | grep 'linux' | grep 'x86_64' | head -1 | sed 's/.*"browser_download_url": "//' | sed 's/".*//')
        echo "Downloading from: $ASSET_URL"
        # Download the correct binary
        curl -L "$ASSET_URL" -o $HOME/.local/bin/kamal
        chmod +x $HOME/.local/bin/kamal
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        # Verify installation
        $HOME/.local/bin/kamal version

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

    - name: Install dependencies
      run: |
        mix local.hex --force
        mix local.rebar --force
        mix deps.get

    - name: Deploy with Kamal
      env:
        AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
        EL_PAIS_RSS_URL: ${{ secrets.EL_PAIS_RSS_URL }}
        MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
        HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      run: |
        # Update the deploy config with the actual host
        sed -i "s/your-hetzner-server-ip/$HETZNER_HOST/g" config/deploy.exs
        # Deploy using the verified kamal installation
        $HOME/.local/bin/kamal deploy 
