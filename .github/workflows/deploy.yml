name: Deploy to Hetzner

on:
  push:
    branches: [main]  # Deploy when pushing to main branch
  workflow_dispatch:  # Allow manual deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: iacutone
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: iacutone/elpais_rss:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 5.161.60.147 >> ~/.ssh/known_hosts
          # Debug: Check if key was written correctly
          echo "Key file size: $(wc -c < ~/.ssh/id_rsa)"
          echo "Key starts with: $(head -1 ~/.ssh/id_rsa)"

      - name: Deploy to Hetzner server
        run: |
          ssh root@5.161.60.147 << 'EOF'
            # Pull the latest image
            docker compose pull
            
            # Stop and remove containers
            docker compose down
            
            # Start containers with latest image
            docker compose up -d
            
            # Clean up old images to save space
            docker image prune -f
            
            # Show running containers
            docker compose ps
          EOF
